<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>REI Co-op · Holiday Countdown</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@600;700;800&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#000000;
    --card:#FFFFFF;
    --ink:#111111;
    --ink-muted:#555555;
    --muted:#C9CFCB;
    --red:#D2232A;      /* holiday red */
    --pine:#2B5640;     /* ridge */
    --ridge:#1A3529;    /* far ridge */
    --gold:#F0B64A;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:transparent}
  body{font-family:"Work Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

  /* 856 x 559 (about 3:2) at every width, 220px to 900px */
  .widget{
    container-type:inline-size;position:relative;isolation:isolate;
    width:100%;min-width:220px;max-width:900px;margin:0 auto;
    aspect-ratio:856 / 559;overflow:hidden;
    display:flex;flex-direction:column;
    background:var(--bg);border-radius:clamp(10px,1.6cqi,14px);
  }
  canvas.snow{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
  .inner{position:relative;z-index:2;flex:1;display:flex;flex-direction:column;padding:3cqi 3.4cqi 0}

  /* Header */
  .top{display:flex;align-items:center;gap:2.2cqi}
  .badge{background:#fff;border-radius:clamp(4px,.9cqi,8px);padding:clamp(3px,.8cqi,7px) clamp(4px,1.1cqi,9px);line-height:0;flex:0 0 auto}
  .logo{height:clamp(18px,5.2cqi,44px);width:auto;display:block}
  h1{flex:1;min-width:0;font-family:"Bitter",Georgia,serif;font-weight:800;font-size:clamp(14px,4.4cqi,38px);line-height:1.05}
  .snowbtn{flex:0 0 auto;display:inline-flex;align-items:center;gap:.4em;font-size:clamp(10px,1.6cqi,14px);font-weight:600;
           border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:.35em .8em;color:#fff}
  .snowbtn[aria-pressed="true"]{background:#fff;color:#000;border-color:#fff}
  .snowbtn:focus-visible,.tab:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

  /* Holiday tabs */
  .tabs{display:flex;gap:1.2cqi;margin-top:2.2cqi;flex-wrap:nowrap}
  .tab{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
       font-weight:600;font-size:clamp(10px,1.8cqi,15px);padding:.5em .6em;border-radius:999px;
       border:1px solid rgba(255,255,255,.35);color:#fff;transition:background .2s,color .2s}
  .tab[aria-selected="true"]{background:var(--red);border-color:var(--red)}
  .tab .short{display:none}

  /* Countdown */
  .clock{display:grid;grid-template-columns:repeat(4,1fr);gap:1.4cqi;margin-block:auto}
  .unit{background:var(--card);border-radius:clamp(6px,1.1cqi,10px);padding:1.3cqi 2px 1cqi;text-align:center}
  .num{font-family:"Bitter",Georgia,serif;font-weight:700;color:var(--ink);line-height:1;
       font-size:clamp(18px,6.6cqi,58px);font-variant-numeric:tabular-nums}
  .unit.days .num{color:var(--red)}
  .lbl{font-size:clamp(9px,1.5cqi,13px);color:var(--ink-muted);margin-top:.3em}

  .merry{display:none;margin-block:auto;text-align:center}
  .merry .big{font-family:"Bitter",Georgia,serif;font-weight:800;color:var(--gold);font-size:clamp(20px,7cqi,60px);line-height:1.05}
  .merry p{color:var(--muted);font-size:clamp(10px,1.8cqi,15px);margin-top:.4em}
  .widget.is-today .clock{display:none}
  .widget.is-today .merry{display:block}

  /* Ridgeline: the marker climbs toward the selected holiday */
  .trail{position:relative;z-index:1;flex:0 0 auto;line-height:0}
  .trail svg{display:block;width:100%;height:auto}
  .hiker{transition:transform .8s ease}
  .caption{position:absolute;left:3.4cqi;right:3.4cqi;bottom:1.6cqi;line-height:1.2;
           display:flex;justify-content:space-between;gap:8px;font-size:clamp(9px,1.5cqi,13px);color:#E6EEE9}
  .caption strong{color:var(--gold);font-weight:600}

  @container (max-width:560px){
    .snowbtn .txt{display:none}
    .caption .msg{display:none}
    .caption{justify-content:flex-end}
  }
  @container (max-width:360px){
    .tab .long{display:none} .tab .short{display:inline}
    .caption{display:none}
  }
  @media (prefers-reduced-motion:reduce){ .hiker,.tab{transition:none} }
</style>
</head>

      <h1 id="hol-title">Holiday countdown</h1>
      <button class="snowbtn" id="snowbtn" aria-pressed="true" aria-label="Snowfall">❄<span class="txt"> Snow</span></button>
    </div>

    <div class="tabs" role="tablist" aria-label="Choose a holiday">
      <button class="tab" role="tab" data-h="blackfriday"><span class="long">Black Friday</span><span class="short">Black Fri</span></button>
      <button class="tab" role="tab" data-h="christmas"><span class="long">Christmas</span><span class="short">Xmas</span></button>

    <div class="clock" role="timer" aria-live="off">
      <div class="unit days"><div class="num" id="d">--</div><div class="lbl" id="dl">days</div></div>
      <div class="unit"><div class="num" id="h">--</div><div class="lbl">hours</div></div>
      <div class="unit"><div class="num" id="m">--</div><div class="lbl">min</div></div>
      <div class="unit"><div class="num" id="s">--</div><div class="lbl">sec</div></div>
    </div>

    <div class="merry" role="status">
      <div class="big" id="today-big">Happy holidays</div>
      <p id="today-msg"></p>
    </div>
  </div>

  <div class="trail" aria-hidden="true">
    <svg viewBox="0 0 900 150" preserveAspectRatio="none">
      <path fill="var(--ridge)" d="M0 95 L90 60 L150 82 L240 34 L320 74 L410 46 L500 80 L600 40 L690 70 L780 50 L900 78 L900 150 L0 150Z"/>
      <path fill="var(--pine)" d="M0 132 L120 112 L210 120 L330 90 L420 101 L540 70 L620 80 L740 40 L800 50 L860 26 L900 38 L900 150 L0 150Z"/>
      <path fill="#fff" opacity=".9" d="M845 33 L860 26 L878 34 L868 37 L860 32 L852 38Z"/>
      <g fill="#0F2219">
        <path d="M60 134 l10 -24 l10 24z"/><path d="M78 134 l8 -18 l8 18z"/>
        <path d="M250 124 l11 -26 l11 26z"/><path d="M470 104 l10 -24 l10 24z"/><path d="M660 86 l9 -22 l9 22z"/>
      </g>
      <path id="path" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="2" stroke-dasharray="2 7"
        d="M20 129 L120 112 L210 120 L330 90 L420 101 L540 70 L620 80 L740 40 L800 50 L860 26"/>
      <path transform="translate(860 13)" fill="var(--gold)" d="M0 -11 L3.2 -3.4 L11 -3.4 L4.8 1.5 L7 9 L0 4.6 L-7 9 L-4.8 1.5 L-11 -3.4 L-3.2 -3.4Z"/>
      <g class="hiker" id="hiker"><circle r="8" fill="var(--red)" stroke="#fff" stroke-width="3"/></g>
    </svg>
    <div class="caption"><span class="msg" id="msg"></span><span id="pct"></span></div>
  </div>
</section>

<script>
(function(){
  const root = document.getElementById('hol');
  const $ = id => document.getElementById(id);
  const pad = n => String(n).padStart(2,'0');

  // 4th Thursday of November (Black Friday is the day after)
  function thanksgiving(y){ const d = new Date(y,10,1); const first = (11 - d.getDay()) % 7 + 1; return new Date(y,10,first + 21); }

  const HOLIDAYS = {
    blackfriday:  { name:'Black Friday', date: y => { const t = thanksgiving(y); return new Date(y, 10, t.getDate() + 1); },
                    greet:'#OptOutside', msg:'Our doors are closed today. Enjoy your day outside.', note:'Black Friday means #OptOutside' },
    christmas:    { name:'Christmas', date: y => new Date(y,11,25), greet:'Merry Christmas',
                    msg:'Thanks for all you do this season.', note:'Season’s greetings from your co-op' },
    newyear:      { name:'New Year’s', date: y => new Date(y+1,0,1), greet:'Happy New Year',
                    msg:'Here’s to new trails ahead.', note:'New year, new trails' }
  };

  // Next occurrence of a holiday (stays on "today" for the whole day)
  function next(h, now){
    let y = now.getFullYear();
    if (h === HOLIDAYS.newyear && now.getMonth() === 0 && now.getDate() === 1) y -= 1;
    let t = h.date(y);
    if (now >= new Date(t.getFullYear(), t.getMonth(), t.getDate() + 1)) t = h.date(y + 1);
    return t;
  }

  let current = 'christmas';
  try { const saved = localStorage.getItem('rei-holiday'); if (saved && HOLIDAYS[saved]) current = saved; } catch(e){}

  const tabs = [...document.querySelectorAll('.tab')];
  function select(key, focus){
    current = key;
    tabs.forEach(t => { const on = t.dataset.h === key; t.setAttribute('aria-selected', on); t.tabIndex = on ? 0 : -1; if (on && focus) t.focus(); });
    try { localStorage.setItem('rei-holiday', key); } catch(e){}
    tick();
  }
  tabs.forEach((t,i) => {
    t.addEventListener('click', () => select(t.dataset.h));
    t.addEventListener('keydown', e => {
      if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
      const j = (i + (e.key === 'ArrowRight' ? 1 : tabs.length - 1)) % tabs.length;
      select(tabs[j].dataset.h, true);
    });
  });

  const path = $('path'), hiker = $('hiker'), len = path.getTotalLength();
  function placeHiker(p){ const pt = path.getPointAtLength(len * p); hiker.setAttribute('transform','translate(' + pt.x + ' ' + (pt.y - 4) + ')'); }

  function tick(){
    const now = new Date(), h = HOLIDAYS[current], t = next(h, now);
    const isToday = now >= t;
    root.classList.toggle('is-today', isToday);
    $('msg').textContent = h.note;

    if (isToday){
      $('today-big').textContent = h.greet; $('today-msg').textContent = h.msg;
      placeHiker(1); $('pct').innerHTML = '<strong>Summit reached</strong>'; return;
    }
    let diff = t - now;
    const d = Math.floor(diff / 864e5); diff -= d * 864e5;
    const hh = Math.floor(diff / 36e5); diff -= hh * 36e5;
    const m = Math.floor(diff / 6e4);   diff -= m * 6e4;
    $('d').textContent = d; $('dl').textContent = d === 1 ? 'day' : 'days';
    $('h').textContent = pad(hh); $('m').textContent = pad(m); $('s').textContent = pad(Math.floor(diff / 1e3));

    // the climb starts October 1 of the season
    const start = new Date(t.getMonth() === 0 ? t.getFullYear() - 1 : t.getFullYear(), 9, 1);
    const p = Math.min(1, Math.max(0, (now - start) / (t - start)));
    placeHiker(p);
    $('pct').innerHTML = '<strong>' + Math.round(p * 100) + '%</strong> to ' + h.name;
  }

  select(current);
  setInterval(tick, 1000);

  // Snowfall with on/off toggle
  const btn = $('snowbtn'), cv = root.querySelector('canvas.snow'), ctx = cv.getContext && cv.getContext('2d');
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let on = !reduce, W = 0, H = 0, flakes = [], raf = null;
  function size(){
    const r = root.getBoundingClientRect(), dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = r.width; H = r.height; cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
    flakes = Array.from({length: Math.round(W / 9)}, () => ({ x: Math.random()*W, y: Math.random()*H,
      r: Math.random()*1.7 + .6, v: Math.random()*.5 + .25, dr: Math.random()*.6 - .3, o: Math.random()*.5 + .35 }));
  }
  function draw(){
    ctx.clearRect(0,0,W,H);
    for (const f of flakes){
      f.y += f.v; f.x += f.dr;
      if (f.y > H){ f.y = -4; f.x = Math.random()*W; }
      if (f.x > W) f.x = 0; if (f.x < 0) f.x = W;
      ctx.globalAlpha = f.o; ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, Math.PI*2); ctx.fill();
    }
    raf = requestAnimationFrame(draw);
  }
  function setSnow(v){
    on = v; btn.setAttribute('aria-pressed', v);
    if (!ctx) return;
    if (v && !raf) draw();
    if (!v){ cancelAnimationFrame(raf); raf = null; ctx.clearRect(0,0,W,H); }
  }
  btn.addEventListener('click', () => setSnow(!on));
  if (ctx){ new ResizeObserver(size).observe(root); size(); }
  setSnow(on);
})();
</script>
</body>
</html>
